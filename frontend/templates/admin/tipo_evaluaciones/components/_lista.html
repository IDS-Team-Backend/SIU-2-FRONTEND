{# Grilla de tarjetas de tipos de evaluación. Requiere en contexto:
   tipo_evaluaciones, curso_id. #}
<div class="card-grid">
    {% for tipo in tipo_evaluaciones %}
        <article class="card">
            <div class="card-content">
                <div class="card-info">
                    <h2>{{ tipo.nombre }}</h2>
                    <p><strong>Tipo ID: {{ tipo. id}}</strong></p>
                    <p>
                        <strong>Modalidad:</strong>
                        {{ 'Grupal' if tipo.es_grupal else 'Individual' }}
                    </p>
                </div>
                <div class="card-actions">
                    <a href="{{ url_for('tipo_evaluaciones.listar_tipo_evaluaciones',
                                        curso_id=curso_id,
                                        accion='editar',
                                        id=tipo.id) }}"
                       title="Editar"
                       class="btn-action btn-action--edit">
                        ✎
                    </a>
                    <form action="{{ url_for('tipo_evaluaciones.eliminar',
                                             curso_id=curso_id,
                                             tipo_evaluacion_id=tipo.id) }}"
                          method="POST"
                          class="form-inline-block"
                          onsubmit="return confirm('¿Estás seguro de que deseas eliminar este tipo de evaluación?');">
                        <button type="submit"
                                title="Eliminar"
                                class="btn-action btn-action--delete">
                            ✕
                        </button>
                    </form>
                </div>
            </div>
        </article>
    {% endfor %}
</div>
