{# Hero del perfil de estudiante. #}
<div class="page-hero">
  <div class="page-hero-text">
    <span class="page-hero-eyebrow">Legajo {{ perfil.legajo }} · {{ perfil.curso.carrera }}</span>
    <h1 class="page-hero-title">{{ perfil.nombre }} {{ perfil.apellido }}</h1>
    <p class="page-hero-subtitle">Perfil de estudiante en {{ perfil.curso.codigo }} · {{ perfil.curso.nombre }}</p>
  </div>
  <div class="page-hero-image">
    <span class="material-symbols-rounded">school</span>
  </div>
</div>
