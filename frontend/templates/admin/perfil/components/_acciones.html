{# Acciones de cuenta del perfil (cambiar contraseña / cerrar sesión).
   Compartido por el perfil de estudiante y el de profesor. #}
<div class="panel perfil-panel">
  <h2 class="panel-title">Acciones</h2>
  <div class="perfil-actions">
    <a href="{{ url_for('password.cambiar') }}" class="perfil-btn-action">
      <span class="material-symbols-rounded">lock</span>
      Cambiar contraseña
    </a>

    <a href="{{ url_for('auth.logout') }}"
       class="perfil-btn-action perfil-btn-action--danger">
      <span class="material-symbols-rounded">logout</span>
      Cerrar sesión
    </a>
  </div>
</div>
