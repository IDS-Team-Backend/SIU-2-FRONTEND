{# Hero del perfil de profesor. #}
<div class="page-hero">
  <div class="page-hero-text">
    <span class="page-hero-eyebrow">{{ perfil.departamento }} · {{ perfil.rol }}</span>
    <h1 class="page-hero-title">{{ perfil.nombre }} {{ perfil.apellido }}</h1>
    <p class="page-hero-subtitle">Perfil docente en {{ perfil.catedra.codigo }} · {{ perfil.catedra.nombre }}</p>
  </div>
  <div class="page-hero-image">
    <span class="material-symbols-rounded">co_present</span>
  </div>
</div>
