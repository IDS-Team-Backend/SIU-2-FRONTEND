{# Filtros del reporte de alumnos (form GET) #}
<div class="filtro-card">
  <form method="GET" action="{{ url_for('reportes.listar_reportes', curso_id=curso_id) }}" id="form-filtros-alumnos">
    <input type="hidden" name="tab" value="alumnos">

    {# Fila 1: Datos Personales / Filtros Básicos #}
    <div class="filtro-row filtro-row-m-bottom">

      <div class="form-group filtro-group w-min-200">
        <label for="nombre_completo">Nombre o Apellido</label>
        <input type="text" id="nombre_completo" name="nombre_completo" class="form-control" placeholder="Ej: Lucas" value="{{ nombre_filtro }}">
      </div>

      <div class="form-group filtro-group w-min-150">
        <label for="padron">Padrón</label>
        <input type="number" id="padron" name="padron" class="form-control" placeholder="Ej: 100003" value="{{ padron_filtro }}">
      </div>

      <div class="form-group filtro-group w-min-200">
        <label for="carrera">Carrera</label>
        <select id="carrera" name="carrera" class="form-control">
          <option value="">Todas...</option>
          <option value="Ingeniería en Informática" {% if carrera_filtro == 'Ingeniería en Informática' %}selected{% endif %}>Ingeniería en Informática</option>
          <option value="Licenciatura en Análisis de Sistemas" {% if carrera_filtro == 'Licenciatura en Análisis de Sistemas' %}selected{% endif %}>Licenciatura en Análisis de Sistemas</option>
          <option value="Ingeniería Civil" {% if carrera_filtro == 'Ingeniería Civil' %}selected{% endif %}>Ingeniería Civil</option>
          <option value="Ingeniería Electrónica" {% if carrera_filtro == 'Ingeniería Electrónica' %}selected{% endif %}>Ingeniería Electrónica</option>
        </select>
      </div>

      <div class="form-group filtro-group w-min-120">
        <label for="anio_ingreso">Año Ingreso</label>
        <input type="number" id="anio_ingreso" name="anio_ingreso" class="form-control" placeholder="Ej: 2024" value="{{ anio_ingreso_filtro }}">
      </div>
    </div>

    {# Fila 2: Rendimiento y Evaluación Académica #}
    <div class="filtro-row filtro-row-align-end">
      <div class="form-group filtro-group w-min-180">
        <label for="evaluacion_id">Evaluación</label>
        <select id="evaluacion_id" name="evaluacion_id" class="form-control">
          <option value="">Seleccione una evaluación</option>
          {% for evaluacion in evaluaciones %}
            <option value="{{ evaluacion.id }}" {% if evaluacion_filtro|string == evaluacion.id|string %}selected{% endif %}>
              {{ evaluacion.titulo }}
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group filtro-group w-min-180">
        <label for="condicion">Estado Examen</label>
        <select id="condicion" name="condicion" class="form-control">
          <option value="">Todos...</option>
          <option value="aprobado" {% if condicion_filtro == 'aprobado' %}selected{% endif %}>Alumnos Aprobados</option>
          <option value="desaprobado" {% if condicion_filtro == 'desaprobado' %}selected{% endif %}>Alumnos Desaprobados</option>
        </select>
      </div>

      <div class="form-group filtro-group w-min-150">
        <label for="nota_mayor_a">Nota Mayor o Igual a</label>
        <input type="number" step="0.01" id="nota_mayor_a" name="nota_mayor_a" class="form-control" placeholder="Ej: 4.00" value="{{ nota_filtro }}">
      </div>

      {# Acciones del formulario #}
      <div class="filtro-acciones">
        <button type="submit" class="btn btn-primary btn-fit">🔍 Filtrar</button>
        <a href="{{ url_for('reportes.listar_reportes', tab='alumnos', curso_id=curso_id) }}" class="btn btn-outline btn-fit btn-link-reset">🔄 Limpiar</a>
      </div>
    </div>
  </form>
</div>
