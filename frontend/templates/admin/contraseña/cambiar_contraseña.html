{% extends "admin/base.html" %}

{% block extra_head %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/perfil.css') }}">
{% endblock %}

{% block content %}
<section>
  <div class="page-hero">
    <div class="page-hero-text">
      <span class="page-hero-eyebrow">Seguridad</span>
      <h1 class="page-hero-title">Cambiar contraseña</h1>
      <p class="page-hero-subtitle">Elegí una contraseña de al menos 8 caracteres</p>
    </div>
    <div class="page-hero-image">
      <span class="material-symbols-rounded">lock_reset</span>
    </div>
  </div>

  <div class="panel perfil-panel" style="max-width:480px">

    <form action="{{ url_for('password.cambiar') }}" method="post">

      <div class="form-group">
        <label for="password_actual" class="form-group__label">Contraseña actual</label>
        <input type="password"
               id="password_actual"
               name="password_actual"
               class="form-control"
               placeholder="Tu contraseña actual"
               required
               autocomplete="current-password">
      </div>

      <div class="form-group">
        <label for="nueva_password" class="form-group__label">Nueva contraseña</label>
        <input type="password"
               id="nueva_password"
               name="nueva_password"
               class="form-control"
               placeholder="Mínimo 8 caracteres"
               minlength="8"
               required
               autocomplete="new-password">
      </div>

      <div class="form-group">
        <label for="confirmar_password" class="form-group__label">Confirmá la nueva contraseña</label>
        <input type="password"
               id="confirmar_password"
               name="confirmar_password"
               class="form-control"
               placeholder="Repetí la nueva contraseña"
               minlength="8"
               required
               autocomplete="new-password">
      </div>

      <div style="display:flex;gap:12px;margin-top:1.5rem">
        <button type="submit" class="btn btn-primary">
          <span class="material-symbols-rounded" style="font-size:16px;vertical-align:middle">save</span>
          Guardar contraseña
        </button>
        <a href="{{ url_for('perfil.index') }}" class="btn btn-outline">
          Cancelar
        </a>
      </div>

    </form>

  </div>
</section>
{% endblock %}
