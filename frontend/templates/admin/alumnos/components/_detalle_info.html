{# Datos personales del alumno (tira compacta). El conteo de cursos vive en
   el encabezado del panel de Cursos. #}
<div class="estu-datos">
  <div class="estu-dato">
    <span class="estu-dato__label">DNI</span>
    <span class="estu-dato__value">{{ detalle.dni }}</span>
  </div>
  <div class="estu-dato">
    <span class="estu-dato__label">Padrón</span>
    <span class="estu-dato__value">{{ detalle.padron }}</span>
  </div>
  <div class="estu-dato">
    <span class="estu-dato__label">Email</span>
    <span class="estu-dato__value">{{ detalle.email }}</span>
  </div>
  <div class="estu-dato">
    <span class="estu-dato__label">Carrera</span>
    <span class="estu-dato__value">{{ detalle.carrera }}</span>
  </div>
  <div class="estu-dato">
    <span class="estu-dato__label">Año de ingreso</span>
    <span class="estu-dato__value">{{ detalle.anio_ingreso }}</span>
  </div>
</div>
