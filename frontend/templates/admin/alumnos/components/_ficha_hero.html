{# Hero de la ficha del estudiante en el curso (Page A). #}
<div class="page-hero">
  <div class="page-hero-text">
    <span class="page-hero-eyebrow">Padrón {{ ficha.padron }} · {{ ficha.carrera }}</span>
    <h1 class="page-hero-title">{{ ficha.nombre }} {{ ficha.apellido }}</h1>
    <p class="page-hero-subtitle">Ficha en {{ ficha.curso.nombre }}</p>
  </div>
  <div class="page-hero-image">
    <span class="material-symbols-rounded">school</span>
  </div>
</div>
